name: '📊 Dependency Submission'

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

jobs:
  submit:
    name: '📊 Submit NuGet dependencies'
    runs-on: windows-latest
    steps:

      - name: '🔽 Checkout'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: '🔧 Setup .NET'
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: '10.x'    # global.json + rollForward:latestMinor — setup-dotnet doesn't honour rollForward, so specify the channel directly

      - name: '☕ Setup JDK 17'
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          java-version: '17'
          architecture: 'x64'
          distribution: 'temurin'

      - name: '📲 Restore .NET workloads'
        run: dotnet workload restore Laerdal.Dfu/Laerdal.Dfu.csproj

      - name: '🔄 Restore'
        run: dotnet restore Laerdal.Dfu/Laerdal.Dfu.csproj

      - name: '📊 Submit dependency snapshot'
        uses: advanced-security/component-detection-dependency-submission-action@a02aeda7a175ad4dd38a13c4d3ff2df9da8f2cf0 # v0.2.0
        with:
          detectorsCategories: NuGet
