name: '🏗 Build & Package'

run-name: >-
  ${{ github.event_name == 'pull_request' &&
      format('🏗 {0} - {1} → {2} by {3}', github.event_name, github.head_ref, github.base_ref, github.actor) ||
      format('🏗 {0} - {1} - {2} by {3}', github.event_name, github.ref_name, github.sha, github.actor) }}

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write   # Needed to create tags and releases
  id-token: write   # Needed for NuGet.org Trusted Publishing OIDC token exchange

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: '1'

  SOLUTION_PATH: 'Laerdal.Dfu.Packages.slnx'
  PACKAGE_OUTPUT_PATH: '${{ github.workspace }}/Artifacts'
  XCODE_APP: '/Applications/Xcode_26.5.app'   # iOS/MacCatalyst SDK 26.5 - must match the TargetPlatformVersion in Laerdal.Dfu.csproj and the workloadVersion in global.json

jobs:

  version:
    uses: laerdal/github_actions/.github/workflows/reusable-version.yml@8f534aa9d64b01cd26b73cb2ae4b08a39d836cfe # v1.0.83
    with:
      config-file: './.config/version.json'
      output-txt: 'output/version/version.txt'
      output-json: 'output/version/version.json'
      output-props: 'output/version/version.props'
      artifact-name: 'version'
      show-summary: true

  build:
    name: '🏗 Build & Pack'
    runs-on: macos-26        # macOS required for net10.0-ios and net10.0-maccatalyst; macos-14/15 images have no Xcode with the 26.5 SDK
    timeout-minutes: 30
    needs: version

    steps:

      - name: '🔽 Checkout'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: '🍎 Select Xcode'
        run: sudo xcode-select -s '${{ env.XCODE_APP }}/Contents/Developer'

      - name: '⬇️ Download Version artifact'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: version
          path: '${{ github.workspace }}/Output/Version'

      - name: '🔧 Setup .NET'
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: '10.x'    # global.json "10.0.0" + rollForward:latestMinor — setup-dotnet doesn't honour rollForward, so specify the channel directly

      - name: '☕ Setup JDK 17'
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          java-version: '17'
          architecture: 'x64'
          distribution: 'temurin'

      - name: '📲 Restore .NET workloads'
        uses: laerdal/github_actions/dotnet@8f534aa9d64b01cd26b73cb2ae4b08a39d836cfe # v1.0.83
        with:
          command: workload
          arguments: restore '${{ github.workspace }}/${{ env.SOLUTION_PATH }}'
          show-summary: true

      - name: '🔄 Restore'
        uses: laerdal/github_actions/dotnet@8f534aa9d64b01cd26b73cb2ae4b08a39d836cfe # v1.0.83
        with:
          command: restore
          path: '${{ github.workspace }}/${{ env.SOLUTION_PATH }}'
          show-summary: true

      - name: '🏗 Build & Pack'
        uses: laerdal/github_actions/dotnet@8f534aa9d64b01cd26b73cb2ae4b08a39d836cfe # v1.0.83
        with:
          command: build
          path: '${{ github.workspace }}/${{ env.SOLUTION_PATH }}'
          configuration: Release
          no-restore: true
          arguments: >
            -p:Laerdal_Version_Full='${{ needs.version.outputs.version-core }}'
            -p:GeneratePackageOnBuild=true
            -p:PackageOutputPath='${{ env.PACKAGE_OUTPUT_PATH }}'
          show-summary: true

      - name: '🏗 Build & Pack (force-dud — net10.0 only, no native bindings)'
        uses: laerdal/github_actions/dotnet@8f534aa9d64b01cd26b73cb2ae4b08a39d836cfe # v1.0.83
        with:
          command: build
          path: '${{ github.workspace }}/Laerdal.Dfu/Laerdal.Dfu.csproj'
          configuration: Release
          arguments: >
            -p:Laerdal_Version_Full='${{ needs.version.outputs.version-core }}'
            -p:BuildOnlyDudNet8=true
            -p:SourceRoot='${{ github.workspace }}/Laerdal.Dfu/'
            -p:GeneratePackageOnBuild=true
            -p:PackageOutputPath='${{ env.PACKAGE_OUTPUT_PATH }}'
          show-summary: true

      # SBOM is generated via the open-source CycloneDX .NET tool (no external service, no
      # Laerdal-internal dependency tracker involved) and released as-is alongside the GitHub
      # Release below. Signing it and feeding it into Laerdal's own SBOM/dependency-tracking
      # system is a deliberate follow-up, not part of this pipeline.
      - name: '📄 Generate CycloneDX SBOM'
        uses: laerdal/github_actions/dotnet-cyclonedx@8f534aa9d64b01cd26b73cb2ae4b08a39d836cfe # v1.0.83
        with:
          path: '${{ github.workspace }}/${{ env.SOLUTION_PATH }}'
          output: '${{ env.PACKAGE_OUTPUT_PATH }}'
          filename: 'Laerdal.Dfu.cyclonedx.json'
          output-format: 'Json'
          set-name: 'Laerdal.Dfu'
          set-version: '${{ needs.version.outputs.version-full }}'
          show-summary: true

      - name: '⬆️ Upload Artifacts'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: 'Artifacts'
          path: '${{ env.PACKAGE_OUTPUT_PATH }}/**/*'
          if-no-files-found: error

  publish-nuget:
    name: '🚀 Publish to NuGet.org'
    if: github.ref == 'refs/heads/main'
    environment:
      name: nuget-org
    runs-on: ubuntu-latest
    needs: build
    steps:

      - name: '⬇️ Download Artifacts'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: Artifacts
          path: Artifacts

      - name: '🔑 NuGet login (OIDC → temp API key)'
        id: nuget-login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        with:
          user: ${{ secrets.NUGET_ORG_USER }}

      - name: '🚀 Push to NuGet.org'
        uses: laerdal/github_actions/dotnet-nuget-upload@8f534aa9d64b01cd26b73cb2ae4b08a39d836cfe # v1.0.83
        with:
          package-path: '${{ github.workspace }}/Artifacts/*.nupkg'
          api-key: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
          source: 'https://api.nuget.org/v3/index.json'
          show-summary: true

  tag-and-release:
    name: '🏷️ Tag & Release'
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: [version, publish-nuget]
    steps:

      - name: '🔄 Checkout'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: '⬇️ Download Artifacts'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: Artifacts
          path: Artifacts

      - name: '🚀 Create GitHub Release'
        uses: laerdal/github_actions/github-release@8f534aa9d64b01cd26b73cb2ae4b08a39d836cfe # v1.0.83
        with:
          tag: ${{ needs.version.outputs.version-fortag }}
          title: 'Release ${{ needs.version.outputs.version-full }}'
          generate-notes: 'true'
          prerelease: ${{ needs.version.outputs.version-isprerelease }}
          assets: 'Artifacts/Laerdal.Dfu.cyclonedx.json'
          show-summary: 'true'
